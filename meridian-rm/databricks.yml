bundle:
  name: meridian-rm

variables:
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  serving_endpoint_name:
    description: Chat serving endpoint name
  serving_embeddings_name:
    description: Embeddings serving endpoint name

resources:
  apps:
    app:
      name: "meridian-rm"
      description: "Meridian Bank RM retention cockpit — surface, prescribe, approve, act"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie
        - serving.serving-endpoints
        - ai-gateway

      # The resources which this app has access to.
      resources:
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: embeddings-endpoint
          serving_endpoint:
            name: ${var.serving_embeddings_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://fe-sandbox-reyden-whisperers.cloud.databricks.com

    variables:
      genie_space_id: 01f1a243d9f810e9b54208917a76af3e
      genie_space_name: Customer Attrition Risk and Retention
      postgres_branch: projects/meridian-bank/branches/production
      postgres_database: projects/meridian-bank/branches/production/databases/databricks-postgres
      postgres_project: projects/meridian-bank
      serving_endpoint_name: databricks-claude-opus-4-8
      serving_embeddings_name: databricks-gte-large-en
